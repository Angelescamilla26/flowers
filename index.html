<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flores Nocturnas</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --dark:#010508;
  --petal-a:#f7d000;--petal-b:#f09800;--petal-c:#fff4a0;--petal-d:#e07000;
  --stem-a:#0c3010;--stem-b:#1a5a1a;--stem-c:#3d9e3d;
  --leaf-a:#092808;--leaf-b:#165016;--leaf-c:#2e8b2e;--leaf-d:#5aba5a;
  --gold-glow:rgba(247,208,0,.65);
}
html,body{width:100%;height:100%;overflow:hidden}
body{background:var(--dark);display:flex;align-items:flex-end;justify-content:center;min-height:100vh;perspective:1100px}

/* SKY */
.sky{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 160% 70% at 50% -10%,#0d2545 0%,#050f20 45%,var(--dark) 80%)}
.sky::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 12% at 60% 28%,rgba(180,200,255,.04) 0%,transparent 100%),radial-gradient(ellipse 50% 8% at 30% 35%,rgba(180,200,255,.025) 0%,transparent 100%);pointer-events:none}

/* MOON */
.moon-wrap{position:fixed;top:5vmin;right:10vmin;z-index:5;animation:moon-drift 30s ease-in-out infinite alternate}
@keyframes moon-drift{0%{transform:translateY(0)}100%{transform:translateY(-1.5vmin)}}
.moon{width:9vmin;height:9vmin;border-radius:50%;background:radial-gradient(circle at 38% 36%,#fffdf0 0%,#ffe990 38%,#f0c440 72%,#c08010 100%);box-shadow:0 0 3vmin 1vmin rgba(255,228,80,.35),0 0 9vmin 3vmin rgba(245,190,40,.18),0 0 22vmin 8vmin rgba(220,160,20,.08);animation:moon-pulse 7s ease-in-out infinite}
@keyframes moon-pulse{0%,100%{box-shadow:0 0 3vmin 1vmin rgba(255,228,80,.35),0 0 9vmin 3vmin rgba(245,190,40,.18),0 0 22vmin 8vmin rgba(220,160,20,.08)}50%{box-shadow:0 0 5vmin 2vmin rgba(255,228,80,.5),0 0 14vmin 5vmin rgba(245,190,40,.25),0 0 28vmin 10vmin rgba(220,160,20,.12)}}
.moon-halo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:28vmin;height:28vmin;border-radius:50%;background:radial-gradient(circle,rgba(255,220,80,.07) 20%,transparent 70%);filter:blur(4vmin);pointer-events:none;animation:moon-pulse 7s ease-in-out infinite}

/* SHOOTING STARS */
.shoot{position:fixed;top:0;z-index:6;pointer-events:none;width:2px;height:2px;border-radius:50%;background:#fff;filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 8px #ffe)}
.shoot::after{content:'';position:absolute;top:50%;right:0;transform:translateY(-50%);width:80px;height:1px;background:linear-gradient(to left,rgba(255,255,255,.8),transparent)}
.shoot--1{top:8%;left:70%;animation:shoot-1 12s 2s linear infinite}
.shoot--2{top:15%;left:40%;animation:shoot-2 16s 7s linear infinite}
.shoot--3{top:5%;left:85%;animation:shoot-3 20s 14s linear infinite}
@keyframes shoot-1{0%,92%{opacity:0;transform:translateX(0) translateY(0) rotate(-30deg)}93%{opacity:1}100%{opacity:0;transform:translateX(-200px) translateY(80px) rotate(-30deg)}}
@keyframes shoot-2{0%,88%{opacity:0;transform:translateX(0) translateY(0) rotate(-25deg)}89%{opacity:1}100%{opacity:0;transform:translateX(-180px) translateY(70px) rotate(-25deg)}}
@keyframes shoot-3{0%,94%{opacity:0;transform:translateX(0) translateY(0) rotate(-35deg)}95%{opacity:1}100%{opacity:0;transform:translateX(-220px) translateY(90px) rotate(-35deg)}}

/* ORBS */
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:3;filter:blur(9vmin);animation:orb-float 18s ease-in-out infinite}
.orb--1{width:35vmin;height:35vmin;background:radial-gradient(circle,rgba(247,200,0,.13),transparent 65%);bottom:15%;left:28%;animation-delay:0s}
.orb--2{width:28vmin;height:28vmin;background:radial-gradient(circle,rgba(0,210,190,.10),transparent 65%);bottom:30%;left:58%;animation-delay:-6s}
.orb--3{width:22vmin;height:22vmin;background:radial-gradient(circle,rgba(160,80,255,.09),transparent 65%);bottom:45%;left:18%;animation-delay:-12s}
.orb--4{width:20vmin;height:20vmin;background:radial-gradient(circle,rgba(0,180,255,.08),transparent 65%);bottom:55%;left:72%;animation-delay:-9s}
@keyframes orb-float{0%{opacity:0;transform:translateY(0) translateX(0)}15%{opacity:1}50%{transform:translateY(-6vmin) translateX(3vmin)}85%{opacity:.7}100%{opacity:0;transform:translateY(-12vmin) translateX(-2vmin)}}

/* WATER */
.water{position:fixed;bottom:0;left:0;right:0;z-index:2;height:12vmin;background:linear-gradient(to top,rgba(5,20,30,.9) 0%,rgba(8,30,45,.6) 40%,transparent 100%);overflow:hidden}
.water::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0px,transparent 3px,rgba(0,40,60,.3) 3px,rgba(0,40,60,.3) 4px);animation:water-ripple 4s linear infinite}
@keyframes water-ripple{0%{transform:translateY(0)}100%{transform:translateY(4px)}}
.moon-reflection{position:fixed;bottom:2vmin;left:50%;z-index:3;transform:translateX(-50%);width:2vmin;height:6vmin;background:linear-gradient(to bottom,rgba(255,230,80,.35),transparent);filter:blur(.6vmin);border-radius:50%;animation:reflect-wobble 3s ease-in-out infinite;pointer-events:none}
@keyframes reflect-wobble{0%,100%{transform:translateX(-50%) scaleX(1)}50%{transform:translateX(-50%) scaleX(1.8)}}

/* MIST */
.mist{position:fixed;bottom:0;left:0;right:0;z-index:3;height:22vmin;background:radial-gradient(ellipse 60% 100% at 20% 100%,rgba(10,50,20,.55) 0%,transparent 80%),radial-gradient(ellipse 60% 100% at 80% 100%,rgba(10,50,20,.55) 0%,transparent 80%),radial-gradient(ellipse 80% 80% at 50% 100%,rgba(5,30,10,.7) 0%,transparent 75%);pointer-events:none;animation:mist-breathe 12s ease-in-out infinite}
@keyframes mist-breathe{0%,100%{opacity:.8;transform:scaleY(1)}50%{opacity:1;transform:scaleY(1.04)}}
.ground-fog{position:fixed;bottom:0;left:0;right:0;z-index:4;height:8vmin;background:linear-gradient(to top,rgba(5,25,8,.85) 0%,rgba(5,25,8,.4) 60%,transparent 100%);pointer-events:none}

/* CANVAS */
#cvs{position:fixed;inset:0;z-index:50;pointer-events:none}

/* SCENE */
.scene{position:relative;width:100vw;height:100vh;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.flowers{position:absolute;bottom:0;width:100%;height:100%;transform:scale(.92);transform-origin:bottom center}

/* FLOWER */
.flower{position:absolute;bottom:10vmin;transform-origin:bottom center;z-index:10;--spd:.85s;cursor:pointer;transition:filter .35s ease;will-change:transform}
.flower:hover{filter:brightness(1.3) drop-shadow(0 0 2.5vmin var(--gold-glow)) drop-shadow(0 0 6vmin rgba(247,200,0,.3))}

/* STEM */
.flower__line{width:1.5vmin;border-radius:1vmin;background:linear-gradient(to right,rgba(0,0,0,.35) 0%,transparent 25%,rgba(255,255,255,.14) 70%,rgba(0,0,0,.25) 100%),linear-gradient(to top,transparent 0%,var(--stem-a) 10%,var(--stem-b) 50%,var(--stem-c) 100%);box-shadow:inset 0 0 1.5px rgba(0,0,0,.7),1px 0 3px rgba(0,0,0,.4);animation:grow-stem 3.8s cubic-bezier(.16,1,.3,1) backwards}
@keyframes grow-stem{0%{height:0 !important}}

/* STEM LEAVES */
.flower__line__leaf{--w:7vmin;--h:calc(var(--w) + 2vmin);position:absolute;top:20%;left:90%;width:var(--w);height:var(--h);border-top-right-radius:var(--h);border-bottom-left-radius:var(--h);background:linear-gradient(135deg,var(--leaf-d) 0%,var(--leaf-c) 35%,var(--leaf-b) 70%,var(--leaf-a) 100%);box-shadow:inset 0 1px 3px rgba(255,255,255,.12),0 2px 7px rgba(0,0,0,.45)}
.flower__line__leaf--1{animation:bloom-r var(--spd) 1.6s backwards}
.flower__line__leaf--2{top:45%;animation:bloom-r var(--spd) 1.4s backwards}
.flower__line__leaf--3,.flower__line__leaf--4,.flower__line__leaf--6{border-radius:0;border-top-left-radius:var(--h);border-bottom-right-radius:var(--h);left:-460%}
.flower__line__leaf--3{top:12%;transform:rotate(-70deg) rotateY(30deg);animation:bloom-l var(--spd) 1.2s backwards}
.flower__line__leaf--4{top:40%;transform:rotate(-70deg) rotateY(30deg);animation:bloom-l var(--spd) 1.0s backwards}
.flower__line__leaf--5{top:0;transform-origin:left;transform:rotate(70deg) rotateY(30deg) scale(.6);animation:bloom-r var(--spd) 1.8s backwards}
.flower__line__leaf--6{top:-2%;left:-450%;transform-origin:right;transform:rotate(-70deg) rotateY(30deg) scale(.6);animation:bloom-l var(--spd) 2.0s backwards}
@keyframes bloom-r{0%{transform-origin:left;transform:rotate(70deg) rotateY(30deg) scale(0)}}
@keyframes bloom-l{0%{transform-origin:right;transform:rotate(-70deg) rotateY(30deg) scale(0)}}

/* FLOWER HEAD */
.flower__leafs{position:relative;animation:bloom-head 2.2s cubic-bezier(.34,1.56,.64,1) backwards}
.flower__leafs--1{animation-delay:1.1s}
.flower__leafs--2{animation-delay:1.4s}
.flower__leafs--3{animation-delay:1.7s}
.flower__leafs::before{content:'';position:absolute;left:50%;top:0;transform:translate(-50%,-50%);width:18vmin;height:18vmin;border-radius:50%;background:radial-gradient(circle,rgba(247,208,0,.28) 0%,rgba(240,150,0,.12) 40%,transparent 72%);filter:blur(2.5vmin);pointer-events:none;animation:halo-pulse 3.5s ease-in-out infinite}
@keyframes halo-pulse{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}}
.flower__leafs::after{content:'';position:absolute;left:0;top:0;transform:translate(-50%,-100%);width:10vmin;height:10vmin;background:radial-gradient(circle,rgba(247,208,0,.5) 0%,rgba(200,140,20,.2) 50%,transparent 75%);filter:blur(1.5vmin);border-radius:50%;pointer-events:none}
@keyframes bloom-head{0%{transform:scale(0) rotate(-25deg);opacity:0}}

/* PETALS */
.flower__leaf{position:absolute;bottom:0;left:50%;width:7.8vmin;height:11.5vmin;border-radius:53% 47% 45% 55% / 44% 46% 54% 56%;background:radial-gradient(ellipse at 40% 85%,var(--petal-d) 0%,var(--petal-b) 30%,var(--petal-a) 60%,var(--petal-c) 100%);box-shadow:inset 0 -2px 7px rgba(180,100,0,.45),inset 0 3px 10px rgba(255,255,160,.55),inset 1px 1px 4px rgba(255,240,100,.3),0 0 6px rgba(247,208,0,.28);transform-origin:bottom center;opacity:.94}
.flower__leaf::before{content:'';position:absolute;left:50%;top:15%;transform:translateX(-50%);width:1px;height:70%;background:linear-gradient(to bottom,rgba(255,255,220,.65),transparent);border-radius:1px;pointer-events:none}
.flower__leaf::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(155deg,rgba(255,255,200,.55) 0%,transparent 45%);pointer-events:none}
.flower__leaf--1{transform:translate(-10%,1%) rotateY(40deg) rotateX(-50deg)}
.flower__leaf--2{transform:translate(-50%,-4%) rotateX(40deg)}
.flower__leaf--3{transform:translate(-90%,0%) rotateY(45deg) rotateX(50deg)}
.flower__leaf--4{width:7.8vmin;height:7.8vmin;transform-origin:bottom left;border-radius:4vmin 10vmin 4vmin 4vmin;transform:translate(0%,18%) rotateX(70deg) rotate(-43deg);z-index:1;opacity:.86}

/* CENTER */
.flower__white-circle{position:absolute;left:-3.5vmin;top:-3vmin;width:9vmin;height:5vmin;border-radius:50%;background:radial-gradient(ellipse at 42% 32%,#fffef2 0%,#fff5a8 35%,#ffd700 75%,#b88000 100%);box-shadow:0 0 2.5vmin .6vmin rgba(255,228,60,.75),0 0 5vmin 1.5vmin rgba(255,200,0,.4),inset 0 -1px 3px rgba(180,110,0,.5);animation:center-pulse 3.2s ease-in-out infinite}
@keyframes center-pulse{0%,100%{box-shadow:0 0 2.5vmin .6vmin rgba(255,228,60,.75),0 0 5vmin 1.5vmin rgba(255,200,0,.4),inset 0 -1px 3px rgba(180,110,0,.5)}50%{box-shadow:0 0 4.5vmin 1.2vmin rgba(255,228,60,.9),0 0 9vmin 3vmin rgba(255,200,0,.55),inset 0 -1px 3px rgba(180,110,0,.5)}}
.flower__white-circle::after{content:'';position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:55%;height:55%;border-radius:50%;background:linear-gradient(90deg,#ffe820,#ffc600);opacity:.6;filter:blur(.3vmin)}

/* LIGHTS */
.flower__light{position:absolute;bottom:0;width:.75vmin;height:.75vmin;border-radius:50%;background:#fffb88;filter:blur(.15vmin);animation:light-drift 4.5s linear infinite backwards}
.flower__light:nth-child(odd){background:#88ffee}
.flower__light--1{left:-2vmin;animation-delay:1.0s}.flower__light--2{left:3vmin;animation-delay:.5s}
.flower__light--3{left:-6vmin;animation-delay:.3s}.flower__light--4{left:6vmin;animation-delay:.9s}
.flower__light--5{left:-1vmin;animation-delay:1.5s}.flower__light--6{left:-4vmin;animation-delay:3.0s}
.flower__light--7{left:3vmin;animation-delay:2.0s}.flower__light--8{left:-6vmin;animation-delay:3.5s}
@keyframes light-drift{0%{opacity:0;transform:translateY(0)}12%{opacity:1}55%{opacity:.8;transform:translateY(-18vmin) translateX(2vmin) scale(1.3);filter:blur(.4vmin)}100%{opacity:0;transform:translateY(-34vmin) translateX(-1vmin);filter:blur(1.8vmin)}}

/* INDIVIDUAL FLOWERS */
.flower--1{left:36%;animation:sw1 5.5s ease-in-out infinite}
.flower--1 .flower__line{height:68vmin;animation-delay:.3s}
.flower--2{left:50%;transform:rotate(18deg);animation:sw2 6.5s ease-in-out infinite}
.flower--2 .flower__line{height:58vmin;animation-delay:.6s}
.flower--3{left:48%;transform:rotate(-14deg);animation:sw3 6s ease-in-out infinite}
.flower--3 .flower__line{height:52vmin;animation-delay:.9s}
.flower--4{left:25%;transform:rotate(8deg);animation:sw4 7s ease-in-out infinite}
.flower--4 .flower__line{height:54vmin;animation-delay:.5s}
.flower--5{left:62%;transform:rotate(-6deg);animation:sw5 6.3s ease-in-out infinite}
.flower--5 .flower__line{height:62vmin;animation-delay:.7s}
.flower--6{left:55%;transform:rotate(14deg);animation:sw6 7.8s ease-in-out infinite}
.flower--6 .flower__line{height:48vmin;animation-delay:1.0s}
@keyframes sw1{0%,100%{transform:rotate(1.5deg)}50%{transform:rotate(-2deg)}}
@keyframes sw2{0%,100%{transform:rotate(18deg)}50%{transform:rotate(14deg)}}
@keyframes sw3{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(-18deg) rotateY(-8deg)}}
@keyframes sw4{0%,100%{transform:rotate(8deg)}50%{transform:rotate(3deg)}}
@keyframes sw5{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(-11deg)}}
@keyframes sw6{0%,100%{transform:rotate(14deg)}50%{transform:rotate(20deg)}}
/* EXTRA FLOWERS */
.flower--7{left:10%;transform:rotate(-10deg);animation:sw7 6.2s ease-in-out infinite}
.flower--7 .flower__line{height:45vmin;animation-delay:.4s}
.flower--8{left:18%;transform:rotate(5deg);animation:sw8 5.2s ease-in-out infinite}
.flower--8 .flower__line{height:72vmin;animation-delay:.2s}
.flower--9{left:72%;transform:rotate(-20deg);animation:sw9 7.1s ease-in-out infinite}
.flower--9 .flower__line{height:50vmin;animation-delay:.8s}
.flower--10{left:82%;transform:rotate(12deg);animation:sw10 5.8s ease-in-out infinite}
.flower--10 .flower__line{height:66vmin;animation-delay:.6s}
.flower--11{left:90%;transform:rotate(-8deg);animation:sw11 6.7s ease-in-out infinite}
.flower--11 .flower__line{height:42vmin;animation-delay:1.1s}
.flower--12{left:3%;transform:rotate(18deg);animation:sw12 5.4s ease-in-out infinite}
.flower--12 .flower__line{height:58vmin;animation-delay:.9s}
.flower--13{left:40%;transform:rotate(-5deg);animation:sw13 6.9s ease-in-out infinite}
.flower--13 .flower__line{height:80vmin;animation-delay:.1s}
.flower--14{left:58%;transform:rotate(22deg);animation:sw14 5.6s ease-in-out infinite}
.flower--14 .flower__line{height:38vmin;animation-delay:1.3s}
@keyframes sw7{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(-14deg) rotateY(6deg)}}
@keyframes sw8{0%,100%{transform:rotate(5deg)}50%{transform:rotate(1deg)}}
@keyframes sw9{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(-16deg) rotateY(-5deg)}}
@keyframes sw10{0%,100%{transform:rotate(12deg)}50%{transform:rotate(17deg)}}
@keyframes sw11{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-13deg)}}
@keyframes sw12{0%,100%{transform:rotate(18deg)}50%{transform:rotate(22deg) rotateY(8deg)}}
@keyframes sw13{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(-9deg)}}
@keyframes sw14{0%,100%{transform:rotate(22deg)}50%{transform:rotate(18deg)}}

/* GRASS */
.flower__grass{--c:var(--leaf-b);--line-w:1.5vmin;position:absolute;bottom:12vmin;left:-7vmin;display:flex;flex-direction:column;align-items:flex-end;z-index:20;transform-origin:bottom center;transform:rotate(-48deg) rotateY(40deg)}
.flower__grass--1{animation:gs1 2.4s ease-in-out infinite}
.flower__grass--2{left:2vmin;bottom:10vmin;transform:scale(.5) rotate(75deg) rotateX(10deg) rotateY(-200deg);opacity:.7;z-index:0;animation:gs2 1.9s ease-in-out infinite}
.flower__grass--3{left:25%;bottom:9vmin;transform:scale(.7) rotate(-30deg) rotateX(10deg) rotateY(40deg);opacity:.75;z-index:5;animation:gs3 2.7s ease-in-out infinite}
.flower__grass--4{left:75%;bottom:8vmin;transform:scale(.6) rotate(20deg) rotateX(10deg) rotateY(-30deg);opacity:.65;z-index:5;animation:gs4 2.1s ease-in-out infinite}
.flower__grass--5{left:90%;bottom:10vmin;transform:scale(.5) rotate(10deg) rotateX(5deg) rotateY(-20deg);opacity:.6;z-index:5;animation:gs5 3s ease-in-out infinite}
.flower__grass--top{width:7vmin;height:10vmin;border-top-right-radius:100%;border-right:var(--line-w) solid var(--c);transform-origin:bottom center;transform:rotate(-2deg)}
.flower__grass--bottom{margin-top:-2px;width:var(--line-w);height:25vmin;background:linear-gradient(to top,transparent,var(--c))}
.flower__grass__leaf{--size:10vmin;position:absolute;width:calc(var(--size)*2.1);height:var(--size);border-top-left-radius:var(--size);border-top-right-radius:var(--size);background:linear-gradient(to top,transparent,transparent 30%,var(--c));z-index:100}
.flower__grass__leaf--1{top:-6%;left:30%;--size:6vmin;transform:rotate(-20deg);animation:ga1 2s 2.6s backwards}
.flower__grass__leaf--2{top:-5%;left:-110%;--size:6vmin;transform:rotate(10deg);animation:ga2 2s 2.4s linear backwards}
.flower__grass__leaf--3{top:5%;left:60%;--size:8vmin;transform:rotate(-18deg) rotateX(-20deg);animation:ga3 2s 2.2s linear backwards}
.flower__grass__leaf--4{top:6%;left:-135%;--size:8vmin;transform:rotate(2deg);animation:ga4 2s 2.0s linear backwards}
.flower__grass__leaf--5{top:20%;left:60%;--size:10vmin;transform:rotate(-24deg) rotateX(-20deg);animation:ga5 2s 1.8s linear backwards}
.flower__grass__leaf--6{top:22%;left:-180%;--size:10vmin;transform:rotate(10deg);animation:ga6 2s 1.6s linear backwards}
.flower__grass__leaf--7{top:39%;left:70%;--size:10vmin;transform:rotate(-10deg);animation:ga7 2s 1.4s linear backwards}
.flower__grass__leaf--8{top:40%;left:-215%;--size:11vmin;transform:rotate(10deg);animation:ga8 2s 1.2s linear backwards}
.flower__grass__overlay{position:absolute;top:-10%;right:0;width:100%;height:100%;background:rgba(0,0,0,.55);filter:blur(1.5vmin);z-index:100}
@keyframes ga1{0%{transform-origin:bottom left;transform:rotate(-20deg) scale(0)}}
@keyframes ga2{0%{transform-origin:bottom right;transform:rotate(10deg) scale(0)}}
@keyframes ga3{0%{transform-origin:bottom left;transform:rotate(-18deg) rotateX(-20deg) scale(0)}}
@keyframes ga4{0%{transform-origin:bottom right;transform:rotate(2deg) scale(0)}}
@keyframes ga5{0%{transform-origin:bottom left;transform:rotate(-24deg) rotateX(-20deg) scale(0)}}
@keyframes ga6{0%{transform-origin:bottom right;transform:rotate(10deg) scale(0)}}
@keyframes ga7{0%{transform-origin:bottom left;transform:rotate(-10deg) scale(0)}}
@keyframes ga8{0%{transform-origin:bottom right;transform:rotate(10deg) scale(0)}}
@keyframes gs1{0%,100%{transform:rotate(-48deg) rotateY(40deg)}50%{transform:rotate(-52deg) rotateY(40deg)}}
@keyframes gs2{0%,100%{transform:scale(.5) rotate(75deg) rotateX(10deg) rotateY(-200deg)}50%{transform:scale(.5) rotate(79deg) rotateX(10deg) rotateY(-200deg)}}
@keyframes gs3{0%,100%{transform:scale(.7) rotate(-30deg) rotateX(10deg) rotateY(40deg)}50%{transform:scale(.7) rotate(-35deg) rotateX(10deg) rotateY(40deg)}}
@keyframes gs4{0%,100%{transform:scale(.6) rotate(20deg) rotateX(10deg) rotateY(-30deg)}50%{transform:scale(.6) rotate(25deg) rotateX(10deg) rotateY(-30deg)}}
@keyframes gs5{0%,100%{transform:scale(.5) rotate(10deg) rotateX(5deg) rotateY(-20deg)}50%{transform:scale(.5) rotate(15deg) rotateX(5deg) rotateY(-20deg)}}

/* LONG GRASS & BIG LEAVES */
.flower__g-long{--w:2vmin;--h:6vmin;--c:var(--leaf-b);position:absolute;bottom:10vmin;left:-3vmin;transform-origin:bottom center;transform:rotate(-30deg) rotateY(-20deg);display:flex;flex-direction:column;align-items:flex-end;animation:glong 3.8s ease-in-out infinite}
.flower__g-long__top{top:calc(var(--h)*-1);width:calc(var(--w)+1vmin);height:var(--h);border-top-right-radius:100%;border-right:.7vmin solid var(--c);transform:translate(-.7vmin,1vmin)}
.flower__g-long__bottom{width:var(--w);height:50vmin;transform-origin:bottom center;background:linear-gradient(to top,transparent 30%,var(--c));clip-path:polygon(35% 0,65% 1%,100% 100%,0% 100%)}
@keyframes glong{0%,100%{transform:rotate(-30deg) rotateY(-20deg)}50%{transform:rotate(-34deg) rotateY(-20deg)}}

<script>
(function(){
  setTimeout(()=>document.body.classList.remove('not-loaded'),900);

  /* Stars */
  const sc=document.getElementById('stars-cvs'),sx=sc.getContext('2d');
  function rStar(){sc.width=innerWidth;sc.height=innerHeight;dStars()}
  function dStars(){
    sx.clearRect(0,0,sc.width,sc.height);
    let s=42;
    const r=()=>{s=(s*16807)%2147483647;return(s-1)/2147483646};
    for(let i=0;i<280;i++){
      const x=r()*sc.width,y=r()*sc.height*.7,rad=r()*1.5+.2,a=r()*.75+.25;
      const hue=r()<.3?220:r()<.5?180:50;
      sx.beginPath();sx.arc(x,y,rad,0,Math.PI*2);
      sx.fillStyle=`hsla(${hue},60%,95%,${a})`;sx.fill();
    }
  }
  rStar();window.addEventListener('resize',rStar);

  /* Fireflies */
  const cv=document.getElementById('cvs'),cx=cv.getContext('2d');
  const rsz=()=>{cv.width=innerWidth;cv.height=innerHeight};
  rsz();window.addEventListener('resize',rsz);
  const C=['#fffb88','#88ffee','#ffd470','#aaffc8','#ffddff','#c8f0ff'];
  const flies=Array.from({length:70},()=>({
    x:Math.random()*innerWidth,y:Math.random()*innerHeight*.82,
    r:Math.random()*1.9+.5,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4-.08,
    life:Math.random()*Math.PI*2,spd:Math.random()*.014+.005,
    col:C[Math.floor(Math.random()*C.length)],trail:[],tMax:Math.floor(Math.random()*8+3)
  }));
  let mx=-999,my=-999;
  window.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
  window.addEventListener('touchmove',e=>{mx=e.touches[0].clientX;my=e.touches[0].clientY},{passive:true});
  setInterval(()=>flies.forEach(f=>{const dx=f.x-mx,dy=f.y-my,d=Math.sqrt(dx*dx+dy*dy);if(d<90){f.vx+=(dx/d)*.7;f.vy+=(dy/d)*.7}}),50);
  const h2r=h=>{const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`${r},${g},${b}`};
  (function frame(){
    cx.clearRect(0,0,cv.width,cv.height);
    flies.forEach(f=>{
      f.life+=f.spd;const a=Math.sin(f.life)*.5+.5;
      f.trail.push({x:f.x,y:f.y,a});
      if(f.trail.length>f.tMax)f.trail.shift();
      f.trail.forEach((p,i)=>{const ta=(i/f.trail.length)*p.a*.35;cx.beginPath();cx.arc(p.x,p.y,f.r*.55,0,Math.PI*2);cx.fillStyle=`rgba(${h2r(f.col)},${ta})`;cx.fill()});
      const g=cx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*7);
      g.addColorStop(0,`rgba(${h2r(f.col)},${a*.45})`);g.addColorStop(1,'transparent');
      cx.beginPath();cx.arc(f.x,f.y,f.r*7,0,Math.PI*2);cx.fillStyle=g;cx.fill();
      cx.beginPath();cx.arc(f.x,f.y,f.r,0,Math.PI*2);cx.fillStyle=`rgba(${h2r(f.col)},${a})`;cx.fill();
      f.vx+=(Math.random()-.5)*.035;f.vy+=(Math.random()-.5)*.035-.002;
      f.vx*=.978;f.vy*=.978;f.x+=f.vx;f.y+=f.vy;
      if(f.x<-12)f.x=cv.width+12;if(f.x>cv.width+12)f.x=-12;
      if(f.y<-12)f.y=cv.height+12;if(f.y>cv.height+12)f.y=-12;
    });
    requestAnimationFrame(frame);
  })();
})();
</script>
